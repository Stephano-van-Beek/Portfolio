<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV | Stephano van Beek</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/portfolio.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="content">
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-meta"><span class="hero-tag">CV</span></div>
        <h1 class="hero-title">Curriculum Vitae</h1>
        <p class="hero-lead">HBO-ICT Cyber Security student.</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="assets/cv.pdf" download>Download CV (PDF)</a>
        </div>
      </div>
    </section>

    <div class="card">
      <h2 class="card-title">Education</h2>
      <ul class="cv-list">
        <li><strong>HBO-ICT, Cyber Security</strong><span>Edit this: school, years</span></li>
        <li><strong>MBO</strong><span>Edit this: study, school, years</span></li>
      </ul>
    </div>

    <div class="card">
      <h2 class="card-title">Skills</h2>
      <p>PHP, HTML/CSS, Python, MySQL, Yii</p>
    </div>

    <iframe src="assets/cv.pdf" title="CV" class="cv-frame"></iframe>
    <p class="muted">Put your CV at <code>assets/cv.pdf</code>.</p>
  </main>

  <div id="site-footer"></div>
  <script src="js/main.js"></script>
</body>
</html>
