<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects | Stephano van Beek</title>
  <link rel="icon" href="https://github.com/Stephano-van-Beek.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/portfolio.css">
</head>
<body data-root="../">
  <div id="site-header"></div>

  <main class="content">
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-meta"><span class="hero-tag" data-i18n="projects.title">Projects</span></div>
        <h1 class="hero-title" data-i18n="projects.title">Projects</h1>
        <p class="hero-lead" data-i18n="projects.lead">Loaded live from my public GitHub repositories. New repositories appear here automatically.</p>
      </div>
    </section>
    <h2 class="section-title" data-i18n="projects.other">Other projects</h2>
    <div class="repo-grid" data-filter="projects"><p class="state-msg">Loading...</p></div>

    <h2 class="section-title" data-i18n="projects.mbo">MBO projects</h2>
    <div class="repo-grid" data-filter="mbo"><p class="state-msg">Loading...</p></div>
  </main>

  <div id="site-footer"></div>
  <script src="../js/i18n.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/repos.js"></script>
</body>
</html>
